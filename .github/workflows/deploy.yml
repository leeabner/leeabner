name: Build and deploy blog

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Required for OIDC: lets the job request a short-lived token that AWS trusts.
permissions:
  id-token: write
  contents: read

# Never run two deploys at once; a newer push waits for the older one.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.169.0
  BUCKET: blog-leeabner
  DISTRIBUTION_ID: E3AB7CPXPIW8TJ

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # themes/lanyon-next is a git submodule

      - name: Install Hugo
        run: |
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz hugo
          sudo mv hugo /usr/local/bin/hugo
          hugo version

      - name: Build
        run: hugo --gc --minify

      - uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/

  deploy:
    needs: build
    # PRs only build; deploys happen from master.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public
          path: public/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync public/ "s3://${BUCKET}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*"
